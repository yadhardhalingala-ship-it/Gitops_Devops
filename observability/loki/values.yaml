
deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: filesystem

  rulerConfig:
    enable_api: true
    alertmanager_url: http://prometheus-alertmanager.default.svc.cluster.local:9093
    enable_alertmanager_v2: true
    poll_interval: 1m
    storage:
      type: local
      local:
        directory: /etc/loki/rules

singleBinary:
  replicas: 1

  persistence:
    enabled: true
    storageClass: standard
    size: 5Gi

  extraVolumes:
    - name: loki-ruler-rules
      configMap:
        name: loki-ruler-rules

  extraVolumeMounts:
    - name: loki-ruler-rules
      mountPath: /etc/loki/rules/fake
      readOnly: true

read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0

lokiCanary:
  enabled: true

gateway:
  enabled: false

minio:
  enabled: false

chunksCache:
  enabled: false

resultsCache:
  enabled: false
