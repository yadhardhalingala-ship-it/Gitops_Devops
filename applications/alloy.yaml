apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: alloy 
  namespace: argocd

spec:
  default: project


  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.16.0
      helm: 
        valueFiles:
          - $values/observability/alloy/values.yaml

    - repoURL: https://github.com/yadhardhalingala-ship-it/Gitops_Devops.git
      targetRevision: main
      ref: values
      path: observability/alloy

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

