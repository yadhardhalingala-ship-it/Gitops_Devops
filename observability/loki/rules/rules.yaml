groups:
  - name: aiops-log-alerts
    interval: 1m
    rules:
      - alert: LokiHighErrorLogs
        expr: |
          sum(count_over_time({namespace="default"} |~ "(?i)error|exception|critical" [5m])) > 5
        for: 2m
        labels:
          severity: warning
          source: loki
        annotations:
          summary: "High error logs detected"
          description: "More than 5 error, exception, or critical log entries detected in the default namespace over five minutes."