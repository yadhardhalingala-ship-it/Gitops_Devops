apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: nginx-gitops
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/yadhardhalingala-ship-it/Gitops_Devops.git
    targetRevision: main
    path: .

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
        - CreateNamespace=true